name: Build All Packages
on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same command publish-to-npm.yml runs before publishing, so a package
      # that only breaks in the full topological build fails here, not mid-release.
      - name: Build
        run: pnpm run build
