name: Run Tests for EVM
on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: pnpm run build:core

      - name: Test
        timeout-minutes: 15
        # createNetwork/forkNetwork spawn their own anvil per chain. The
        # setupAndExport test additionally connects to two externally-run chains
        # on :8545/:8546, so start those here.
        run: |
          nohup sh -c "anvil -p 8545 > /dev/null 2>&1" < /dev/null &
          nohup sh -c "anvil -p 8546 > /dev/null 2>&1" < /dev/null &
          sleep 5
          pnpm run test:core
