version: "3"
services:
  traefik:
    # The official v2 Traefik docker image
    image: traefik:v2.10
    container_name: traefik
    # Route via the file provider (dynamic.yml) rather than the Docker provider:
    # Traefik v2's Docker client speaks API 1.24, which Docker Engine 28+ rejects
    # (minimum 1.40), breaking label discovery on modern hosts. The file provider
    # needs no Docker socket and works on any Docker version.
    command:
      - --api.insecure=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
    ports:
      # The HTTP port
      - "80:80"
      # The Web UI (enabled by --api.insecure=true)
      - "28080:8080"
    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
networks:
  default:
    name: traefik_default
